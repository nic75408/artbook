<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent：状态栏透明且浮在内容之上，详情页头图才能延伸到状态栏后面。
       代价：状态栏符号恒为白色（iOS 不提供「透明 + 黑字」选项，见 t_ea885f07 交付说明）。 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="艺术手册">
  <meta name="description" content="每日 30 幅艺术史杰作的私人画册">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>艺术手册</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/pwa-icon-yi-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/pwa-icon-yi-192.png">
  <link rel="stylesheet" href="app.css">

  <!-- 首屏关键链路预声明（t_a450af65）
       原先首屏要串行走 7 层往返：html → app.js → 二级模块 → 三级模块
       → 图标 → index.json → 期文件 → 图片，100ms RTT 下白屏约 1.3s。
       浏览器只有解析完上一层才知道下一层要什么，所以这里把整个模块图和
       首屏数据提前声明出来，让它们与 app.js 并行下载，把层数压到最少。
       路径一律相对（站点部署在 /artbook/ 子路径，根相对路径会 404）。 -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/router.js">
  <link rel="modulepreload" href="js/feed.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/icons/Icon.js">
  <link rel="modulepreload" href="js/icons/inline.js">
  <link rel="modulepreload" href="js/sw-reg.js">
  <link rel="modulepreload" href="config.js">
  <!-- 首屏数据：与模块图并行拉取，不必等整个模块图求值完才发出请求 -->
  <link rel="preload" href="data/index.json" as="fetch" crossorigin="anonymous">
  <!-- 画作图片来自博物馆 CDN：提前握手，省掉 DNS + TLS 的往返 -->
  <link rel="preconnect" href="https://openaccess-cdn.clevelandart.org" crossorigin>
  <link rel="preconnect" href="https://images.metmuseum.org" crossorigin>

  <style>/* 内联关键 CSS，避免首屏白屏 */
    #view{min-height:100dvh;background:#F5F1EA}
    body{margin:0;background:#F5F1EA;color:#1D1B16;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  </style>
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
