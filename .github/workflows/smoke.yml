name: smoke

# M1 冒烟测试：验证 lboneapi 网关从 GitHub Actions 公网环境的可达性、
# 鉴权、文本与图像输入；以及三个博物馆 API 的公网可达性。
# 通过后 pipeline 可跑在托管 runner；失败则按 SPE §11 切换本地方案。
#
# 判读规则（防假绿）：
#   401 = 网关活着但没带 key / key 无效（本地可达性 OK）
#   403 = 鉴权之前的来源层拒绝（IP 白名单 / 地域限制），本地通而这里 403
#         = 网关仅内网可达 → 触发 SPE §11 预案
#   200 = 全通
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: lboneapi probe (no auth, dump headers)
        run: |
          echo "== GET /v1/models (no key) =="
          code=$(curl -m 30 -sS -o /tmp/lb_probe.json -D /tmp/lb_probe_headers.txt -w "%{http_code}" \
            https://lboneapi.longbridge-inc.com/v1/models)
          echo "HTTP_CODE=$code"
          cat /tmp/lb_probe_headers.txt
          head -c 300 /tmp/lb_probe.json
          echo
          # 401 = 网关可达；403 = 来源层拒绝；其余 = 异常
          case "$code" in
            401) echo "PROBE: gateway reachable, auth required (401) — OK";;
            403) echo "PROBE: FORBIDDEN at source layer (403) — gateway rejects this IP/region";;
            *)   echo "PROBE: unexpected code $code";;
          esac
      - name: lboneapi text chat
        run: |
          echo "== lboneapi /v1/chat/completions (text) =="
          code=$(curl -m 120 -sS -o /tmp/lb_text.json -w "%{http_code}" \
            -X POST https://lboneapi.longbridge-inc.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLM_API_KEY }}" \
            -d '{"model":"qwen3.5-plus","messages":[{"role":"user","content":"用一句话回答：1+1等于几"}]}')
          echo "HTTP_CODE=$code"
          head -c 500 /tmp/lb_text.json
          echo
          [ "$code" = "200" ] || { echo "FAIL: expected 200, got $code"; exit 1; }
      - name: lboneapi vision via image URL
        run: |
          echo "== lboneapi vision (image_url) =="
          code=$(curl -m 180 -sS -o /tmp/lb_vision.json -w "%{http_code}" \
            -X POST https://lboneapi.longbridge-inc.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLM_API_KEY }}" \
            -d '{"model":"qwen3.5-plus","messages":[{"role":"user","content":[{"type":"text","text":"这张图里画的是什么？用不超过40字描述画面内容。"},{"type":"image_url","image_url":{"url":"https://images.metmuseum.org/CRDImages/ad/original/DP215410.jpg"}}]}]}')
          echo "HTTP_CODE=$code"
          head -c 800 /tmp/lb_vision.json
          echo
          [ "$code" = "200" ] || { echo "FAIL: expected 200, got $code"; exit 1; }
      - name: museum APIs reachability
        run: |
          fail=0
          for u in \
            "https://collectionapi.metmuseum.org/public/collection/v1/objects/11417" \
            "https://api.artic.edu/api/v1/artworks/search?q=monet&limit=1" \
            "https://openaccess-api.clevelandart.org/api/artworks/?cc0=1&has_image=1&type=Painting&limit=1"; do
            code=$(curl -m 30 -sS -o /dev/null -w "%{http_code}" "$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "FAIL: 博物馆 API 有非 200"; exit 1; }
