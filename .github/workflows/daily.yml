name: daily

# 艺术手册每日发布（SPE §6.4）
#
# 状态（2026-08-13 M1c 实测）：lboneapi 网关仅内网可达，GitHub Actions
# 托管 runner 被 403（来源层拒绝），此 workflow 在托管 runner 上跑不通。
# 按 SPE §11 预案，日常 pipeline 已切到本地 launchd（com.artbook.pipeline，
# 每天 05:00 本地生成 + commit + push）。本 workflow 仅保留 workflow_dispatch
# 作为手动兜底；若未来 lboneapi 开放公网访问，恢复 schedule 即可。
#
# 历史 cron（勿删，恢复时用）：
#   schedule: "0 21 * * *" = UTC 21:00 = 北京时间次日 05:00
#   1) GitHub 会在仓库 60 天无 commit 后自动停用 schedule；本项目每日一次
#      commit 天然规避。长时间停更后手动跑一次 workflow_dispatch 即恢复。
#   2) cron 实际触发可能延迟 15-30 分钟，可接受。
#   3) 失败即工作流失败，GitHub 默认邮件通知仓库 owner，无需额外报警。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "生成哪一期的内容（YYYY-MM-DD，留空=今天 Asia/Shanghai）"
        required: false
        default: ""
      force:
        description: "force（true 覆盖已有期文件）"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install deps
        run: pip install -r pipeline/requirements.txt
      - name: Unit tests（t_866be207 发布闸门校验逻辑）
        run: python -m unittest discover -s tests -q
      - name: Run pipeline (内部完成 commit + push)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RIJKS_API_KEY: ${{ secrets.RIJKS_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python pipeline/generate.py "${ARGS[@]}"
